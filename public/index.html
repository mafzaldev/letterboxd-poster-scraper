<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letterboxd Movie Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── Upload screen ──────────────────────────────────────────────────── -->
  <section id="upload-screen" class="screen active">
    <div class="upload-card">
      <div class="logo">🎬</div>
      <h1>Letterboxd<br /><span>Movie Picker</span></h1>
      <p class="subtitle">Upload your watchlist &amp; let fate decide your next watch</p>

      <label class="drop-zone" id="drop-zone">
        <input type="file" id="csv-input" accept=".csv" hidden />
        <div class="drop-icon">📂</div>
        <span id="drop-label">Drop your <strong>watchlist.csv</strong> here<br />or click to browse</span>
      </label>

      <div id="upload-progress" class="upload-progress hidden">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <span id="progress-text">Fetching posters… 0 / 0</span>
      </div>

      <button id="start-btn" class="btn-primary" disabled>
        <span>✨ Fetch Posters</span>
      </button>

      <p id="error-msg" class="error-msg hidden"></p>
    </div>
  </section>

  <!-- ── Carousel screen ───────────────────────────────────────────────── -->
  <section id="carousel-screen" class="screen">
    <header class="top-bar">
      <button id="back-btn" class="btn-ghost">← New List</button>
      <h2 id="movie-count-label"></h2>
      <button id="music-btn" class="btn-ghost" title="Toggle music">🔇 Music</button>
    </header>

    <div class="carousel-wrapper" id="carousel-wrapper">
      <button class="carousel-arrow left"  id="arrow-left">&#8249;</button>
      <div class="carousel-track-outer">
        <div class="carousel-track" id="carousel-track"></div>
      </div>
      <button class="carousel-arrow right" id="arrow-right">&#8250;</button>
    </div>

    <div class="now-showing" id="now-showing">
      <p id="now-title"></p>
      <p id="now-year"></p>
    </div>

    <button id="pick-btn" class="btn-pick">
      🎲 Pick a Random Movie
    </button>

    <div id="winner-overlay" class="winner-overlay hidden">
      <div class="winner-card">
        <img id="winner-img" src="" alt="" />
        <h2 id="winner-title"></h2>
        <p  id="winner-year"></p>
        <button id="winner-close" class="btn-primary">Watch Something Else</button>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
