<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letterboxd Movie Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Home screen ─────────────────────────────────────────────────────── -->
  <section id="home-screen" class="screen active">
    <div class="home-layout">

      <!-- Left panel: brand + upload -->
      <aside class="home-sidebar">
        <div class="brand">
          <h1>Letterboxd<br /><span>Movie Picker</span></h1>
          <p class="subtitle">Upload your watchlist and let fate decide your next watch</p>
        </div>

        <div class="upload-section">
          <label class="drop-zone" id="drop-zone">
            <input type="file" id="csv-input" accept=".csv" hidden />
            <p class="drop-hint" id="drop-label">Drop <strong>watchlist.csv</strong> here<br />or click to browse</p>
          </label>

          <div id="upload-progress" class="upload-progress hidden">
            <div class="progress-bar-wrap">
              <div class="progress-bar" id="progress-bar"></div>
            </div>
            <span id="progress-text">Fetching posters... 0 / 0</span>
          </div>

          <button id="start-btn" class="btn-primary" disabled>Fetch Posters</button>
          <p id="error-msg" class="error-msg hidden"></p>
        </div>
      </aside>

      <!-- Right panel: saved watchlists -->
      <main class="watchlists-panel">
        <h2 class="panel-title">Your Watchlists</h2>
        <div id="watchlists-list" class="watchlists-list"></div>
        <p id="no-watchlists" class="no-watchlists hidden">
          No watchlists yet. Upload a CSV to get started.
        </p>
      </main>

    </div>
  </section>

  <!-- ── Carousel screen ─────────────────────────────────────────────────── -->
  <section id="carousel-screen" class="screen">
    <header class="top-bar">
      <button id="back-btn" class="btn-ghost">Back</button>
      <div class="top-bar-center">
        <span id="watchlist-name-label" class="top-bar-name"></span>
        <span id="movie-count-label" class="top-bar-count"></span>
      </div>
      <button id="music-btn" class="btn-ghost">Music OFF</button>
    </header>

    <div class="poster-grid" id="poster-grid"></div>

    <div class="bottom-bar">
      <button id="pick-btn" class="btn-pick">Pick Random</button>
    </div>

    <div id="winner-overlay" class="winner-overlay hidden">
      <div class="winner-card">
        <img id="winner-img" src="" alt="" />
        <h2 id="winner-title"></h2>
        <p id="winner-year"></p>
        <button id="winner-close" class="btn-primary">Watch Something Else</button>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
